<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Monitoring Data</title>
<style>
  :root { --bg:#f4f6f8; --card:#fff; --text:#1b2430; --muted:#6b7684; --accent:#0a7cff; --on:#1f9d55; --off:#9aa5b1; --border:#e2e6ea; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#10151b; --card:#1a2129; --text:#e8edf2; --muted:#8a96a3; --accent:#4da3ff; --on:#3ecf7a; --off:#5b6672; --border:#2a333d; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:20px; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  main { max-width:560px; margin:0 auto; }
  h1 { font-size:1.3rem; margin:0 0 4px; }
  .sub { color:var(--muted); font-size:.85rem; margin-bottom:16px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; }
  .label { color:var(--muted); font-size:.8rem; }
  .value { font-size:2rem; font-weight:600; margin-top:4px; }
  .full { grid-column:1 / -1; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .dot { display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--off); margin-right:6px; }
  .dot.ok { background:var(--on); }
  button { border:0; border-radius:10px; padding:10px 18px; font-size:.95rem; font-weight:600; cursor:pointer; background:var(--off); color:#fff; min-width:84px; }
  button.on { background:var(--on); }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .hint { color:var(--muted); font-size:.75rem; margin-top:14px; }
</style>
</head>
<body>
<main>
  <h1>Dashboard Monitoring Data</h1>
  <div class="sub"><span id="conn" class="dot"></span><span id="connText">Menghubungkan ke broker…</span></div>

  <div class="grid">
    <div class="card"><div class="label">Suhu</div><div class="value"><span id="temp">--</span> °C</div></div>
    <div class="card"><div class="label">Kelembapan</div><div class="value"><span id="hum">--</span> %</div></div>

    <div class="card full row">
      <div><div class="label">Status </div><div><span id="unoDot" class="dot"></span><span id="unoText">Belum ada data</span></div></div>
    </div>

    <div class="card full row">
      <div><div class="label">Relay 1</div><div id="r1text" class="value" style="font-size:1.3rem">--</div></div>
      <button id="r1btn" disabled>Toggle</button>
    </div>
    <div class="card full row">
      <div><div class="label">Relay 2</div><div id="r2text" class="value" style="font-size:1.3rem">--</div></div>
      <button id="r2btn" disabled>Toggle</button>
    </div>
  </div>

  <p class="hint">Connected With MQTT Broker.</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
  // ===== PENGATURAN (harus sama dengan kode Uno) =====
  const BROKER_URL = "wss://broker.hivemq.com:8884/mqtt";
  const PREFIX = "ew/embud199/";
  // ===================================================

  const $ = (id) => document.getElementById(id);
  const state = { relay1: "OFF", relay2: "OFF" };

  const client = mqtt.connect(BROKER_URL, {
    clientId: "web-" + Math.random().toString(16).slice(2, 10),
    reconnectPeriod: 3000,
    connectTimeout: 8000
  });

  client.on("connect", () => {
    $("conn").classList.add("ok");
    $("connText").textContent = "Terhubung ke broker";
    client.subscribe(PREFIX + "#");
  });
  client.on("reconnect", () => {
    $("conn").classList.remove("ok");
    $("connText").textContent = "Menghubungkan ulang…";
  });
  client.on("offline", () => {
    $("conn").classList.remove("ok");
    $("connText").textContent = "Terputus dari broker";
  });

  client.on("message", (topic, payload) => {
    const val = payload.toString();
    const key = topic.slice(PREFIX.length);
    if (key === "suhu") $("temp").textContent = val;
    else if (key === "lembap") $("hum").textContent = val;
    else if (key === "status") {
      const up = val === "online";
      $("unoDot").classList.toggle("ok", up);
      $("unoText").textContent = up ? "Online" : "Offline";
      $("r1btn").disabled = !up;
      $("r2btn").disabled = !up;
    }
    else if (key === "relay1/state") renderRelay(1, val);
    else if (key === "relay2/state") renderRelay(2, val);
  });

  function renderRelay(n, val) {
    state["relay" + n] = val;
    $("r" + n + "text").textContent = val === "ON" ? "ON" : "OFF";
    $("r" + n + "btn").classList.toggle("on", val === "ON");
  }

  function toggle(n) {
    const next = state["relay" + n] === "ON" ? "OFF" : "ON";
    // tanpa retain, supaya relay tidak menyala sendiri saat Uno restart
    client.publish(PREFIX + "relay" + n + "/set", next, { retain: false });
  }
  $("r1btn").addEventListener("click", () => toggle(1));
  $("r2btn").addEventListener("click", () => toggle(2));
</script>
</body>
</html>
